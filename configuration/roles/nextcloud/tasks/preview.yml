- name: Nextcloud preview directory
  ansible.builtin.file: {path: "{{ matrix_preview_root }}/srv/alitech/services/nextcloud", state: directory, mode: "0755"}
  delegate_to: localhost

- name: Nextcloud deployment manifest
  ansible.builtin.template:
    src: deployment-manifest.yml.j2
    dest: "{{ matrix_preview_root }}/srv/alitech/services/nextcloud/deployment-manifest.yml"
    mode: "0644"
  delegate_to: localhost
