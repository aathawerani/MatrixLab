- name: Preview directory
  ansible.builtin.file:
    path: "{{ matrix_preview_root }}/etc/gitlab-runner"
    state: directory
    mode: "0755"
  delegate_to: localhost

- name: GitLab Runner private CA trust manifest
  ansible.builtin.template:
    src: tls-trust-manifest.yml.j2
    dest: "{{ matrix_preview_root }}/etc/gitlab-runner/tls-trust.yml"
    mode: "0644"
  delegate_to: localhost
