    observed_digest: sha256:d88929dc8386420b8963f86cabb667fdaf733eef9dcf8fc98e226801a32c023c
    components:
      redis:
        kind: compose
        image: redis
        version: 7.4-alpine
        observed_digest: sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    deployment:
      type: compose
      project_name: nextcloud
      observed_services:
        app:
          image: nextcloud:35.0.2-apache
          purpose: web application
          host_bind: 127.0.0.1:8081:80
          bind_mounts:
          - /srv/alitech/services/nextcloud/html:/var/www/html
          - /srv/alitech/services/nextcloud/data:/var/www/data
        cron:
          image: nextcloud:35.0.2-apache
          purpose: background jobs
          bind_mounts:
          - /srv/alitech/services/nextcloud/html:/var/www/html
          - /srv/alitech/services/nextcloud/data:/var/www/data
        redis:
          image: redis:7.4-alpine
          purpose: application cache
          observed_data_mount: anonymous /data volume
      database_mode: external_postgresql
      database_endpoint_source: resolved PostgreSQL dependency
      secret_directory: /srv/alitech/secrets/nextcloud
      preview_note: Inventory-derived deployment manifest. Secret file names and remaining
        runtime settings must be confirmed before deployment.
      observed_environment_categories:
      - Apache/PHP limits
      - trusted domains
      - PostgreSQL connection and secret-file settings
      - Redis host and port
  mattermost:
    kind: package
    version: 12.0.2
    ports:
      http: 8065
    requires:
    - app: postgresql
      port: postgres
      hba_type: host
      client_tls: unknown
    database:
      name: mattermost
      role: mattermost_app
    exposure: public_candidate
    deployment:
      type: native_systemd
      systemd_unit: /usr/lib/systemd/system/mattermost.service
      executable: /opt/mattermost/bin/mattermost
      run_user: mattermost
      config_file: /opt/mattermost/config/config.json
      data_directory: /opt/mattermost/data/
      managed_config_fragment:
        ServiceSettings:
          SiteURL: https://mattermost.matrix-dev.internal
          ListenAddress: 127.0.0.1:8065
        SqlSettings:
          DriverName: postgres
          MaxIdleConns: 50
          MaxOpenConns: 100
        FileSettings:
          DriverName: local
          Directory: /opt/mattermost/data/
      database_mode: external_postgresql
      database_endpoint_source: resolved PostgreSQL dependency
      secret_handling: Preserve existing DataSource; inject credentials through secret
        management. Never replace the complete config.json with this fragment.
      preview_note: Valid JSON merge fragment only; it intentionally excludes SqlSettings.DataSource
        and all credentials.
    package:
      name: mattermost
      version: 12.0.2-0
      repository: https://deb.packages.mattermost.com
      distribution: noble
      component: main
      architecture: amd64
      observed_deb_sha256: 17b84164828f2fb80cce35bf017413dd64b5eff3cf3ca823470552d62840a858
  sonarqube:
    kind: compose
    version: 26.11.0.134175-community
    ports:
      http: 9000
    requires:
    - app: postgresql
      port: postgres
      hba_type: host
      client_tls: unknown
    database:
      name: sonarqube
      role: sonarqube_app
    exposure: private
    host_sysctls:
      vm.max_map_count: 524288
      fs.file-max: 131072
    advisories:
      avoid_colocation_with:
      - caddy
      - postgresql
      reason: Caddy's host is meant for public apps and demos; SonarQube's Elasticsearch
        can contend with PostgreSQL for memory and I/O. Measure capacity first.
    image: sonarqube
    observed_digest: sha256:1ce197471f5f2bac347694a336862fd2c23e9f57c6edb46acebbfbe70f2c7d9c
