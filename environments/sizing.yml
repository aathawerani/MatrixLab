# Logical size -> provider machine type. PROVISIONAL: each row
# keeps vCPU/RAM equal across clouds; re-select after the VM02/VM03 capacity
# inventory. Topologies refer only to the logical names.

sizes:
  small:  {vcpu: 2, memory_gb: 4}
  medium: {vcpu: 2, memory_gb: 8}
  large:  {vcpu: 4, memory_gb: 16}
  xlarge: {vcpu: 8, memory_gb: 32}

providers:
  gcp:
    small: e2-medium
    medium: e2-standard-2
    large: e2-standard-4
    xlarge: e2-standard-8
  aws:
    small: t3.medium
    medium: m6i.large
    large: m6i.xlarge
    xlarge: m6i.2xlarge
  azure:
    small: Standard_B2s
    medium: Standard_D2s_v5
    large: Standard_D4s_v5
    xlarge: Standard_D8s_v5
