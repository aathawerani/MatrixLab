environment: development
provider: gcp
managed_by_opentofu: true
network:
  project: CHANGE-ME-project-id
  region: us-central1
  zone: us-central1-b
  vpc: matrix-dev2-vpc
  subnet: matrix-dev2-subnet
  cidr: 10.30.0.0/24
access:
  method: gcp_iap
nodes:
  vm01:
    hostname: matrix-dev2-vm-01
    private_ip: 10.30.0.10
    size: medium
    disk_gb: 100
    applications:
    - gitlab
  vm02:
    hostname: matrix-dev2-vm-02
    private_ip: 10.30.0.11
    size: medium
    disk_gb: 100
    applications:
    - postgresql
    - gitlab_runner
  vm03:
    hostname: matrix-dev2-vm-03
    private_ip: 10.30.0.12
    size: large
    disk_gb: 150
    applications:
    - caddy
    - openproject
    - nextcloud
    - mattermost
  vm04:
    hostname: matrix-dev2-vm-04
    private_ip: 10.30.0.13
    size: medium
    disk_gb: 60
    applications:
    - sonarqube
routes:
  openproject.matrix-dev.internal: openproject
  nextcloud.matrix-dev.internal: nextcloud
  mattermost.matrix-dev.internal: mattermost
caddy:
  bind: 127.0.0.1
  tls: internal
app_settings:
  gitlab:
    external_url: https://gitlab.matrix-dev.internal
    listen_private: true
    tls:
      certificate_strategy: private_pki
      hostname: gitlab.matrix-dev.internal
      certificate_path: /etc/gitlab/ssl/gitlab.matrix-dev.internal.crt
      certificate_key_path: /etc/gitlab/ssl/gitlab.matrix-dev.internal.key
      listener_port: 443
      runner_trust_required: true
      note: Target configuration only. Provision the server certificate/key and trusted
        CA separately; Ansible adds the private hostname-to-IP mapping in /etc/hosts,
        so internal DNS is not required.
  gitlab_runner:
    tls_ca_path: /etc/gitlab-runner/certs/gitlab.matrix-dev.internal.crt
    hostname: gitlab.matrix-dev.internal
    url: https://gitlab.matrix-dev.internal
